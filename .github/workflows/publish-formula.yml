# =============================================================================
# publish-formula.yml - render, verify and publish the formula for an IDEasy version
# =============================================================================
# This is the single implementation of the publishing sequence. It is used in two ways:
#
#   1. Called by the release workflow of devonfw/IDEasy via 'uses:' (workflow_call). Homebrew is a
#      primary distribution channel, so the release calls this workflow synchronously: if publishing
#      fails, the calling job fails and with it the whole IDEasy release. The release passes the
#      checksums of the archives it just built, which are then verified against what Maven Central
#      serves.
#
#   2. Triggered manually (workflow_dispatch) for recovery: catching up after the tap fell behind,
#      or re-publishing a version whose formula needs to be regenerated. Without checksums passed
#      in, they are taken from Maven Central.
#
# Keeping both paths in one workflow means there is nothing to keep in sync between the two
# repositories - the release owns when to publish, this workflow owns how.
# =============================================================================

name: Publish formula

on:
  workflow_call:
    inputs:
      version:
        description: "IDEasy version to publish, e.g. 2026.07.002"
        required: true
        type: string
      ref:
        description: "Ref of this tap to publish from"
        required: false
        default: main
        type: string
      sha_mac_arm64:
        description: "Checksum of the released mac-arm64 archive, verified against Maven Central"
        required: false
        default: ""
        type: string
      sha_mac_x64:
        description: "Checksum of the released mac-x64 archive, verified against Maven Central"
        required: false
        default: ""
        type: string
      sha_linux_arm64:
        description: "Checksum of the released linux-arm64 archive, verified against Maven Central"
        required: false
        default: ""
        type: string
      sha_linux_x64:
        description: "Checksum of the released linux-x64 archive, verified against Maven Central"
        required: false
        default: ""
        type: string
    secrets:
      ACTION_PUSH_TOKEN:
        description: "Token with write access to this tap. Required when called from another repository."
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "IDEasy version to publish, e.g. 2026.07.002"
        required: true
        type: string
      ref:
        description: "Ref of this tap to publish from"
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  render:
    name: Render formula
    runs-on: ubuntu-latest
    steps:
      # The repository is always given explicitly: when this workflow is called from devonfw/IDEasy,
      # a plain checkout would check out the calling repository instead of this tap.
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: devonfw/homebrew-IDEasy
          ref: ${{ inputs.ref }}

      - name: Resolve checksums from Maven Central
        id: central
        env:
          VERSION: ${{ inputs.version }}
          SHA_MAC_ARM64: ${{ inputs.sha_mac_arm64 }}
          SHA_MAC_X64: ${{ inputs.sha_mac_x64 }}
          SHA_LINUX_ARM64: ${{ inputs.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ inputs.sha_linux_x64 }}
        run: |
          # With checksums passed in by the release, they are verified against what Central serves.
          # Without them, they are taken from Central. Either way the script reports them and fails
          # if the artifacts do not become available.
          if [[ -n "${SHA_MAC_ARM64}" ]]
          then
            ./wait-for-central.sh "${VERSION}" \
              "${SHA_MAC_ARM64}" "${SHA_MAC_X64}" "${SHA_LINUX_ARM64}" "${SHA_LINUX_X64}"
          else
            ./wait-for-central.sh "${VERSION}"
          fi

      - name: Render formula
        run: |
          ./render-formula.sh "${{ inputs.version }}" \
            "${{ steps.central.outputs.sha_mac_arm64 }}" \
            "${{ steps.central.outputs.sha_mac_x64 }}" \
            "${{ steps.central.outputs.sha_linux_arm64 }}" \
            "${{ steps.central.outputs.sha_linux_x64 }}"

      - name: Upload rendered formula
        uses: actions/upload-artifact@v7
        with:
          name: formula
          path: Formula/ideasy.rb

  verify:
    name: Verify formula
    needs: render
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: devonfw/homebrew-IDEasy
          ref: ${{ inputs.ref }}

      - name: Download rendered formula
        uses: actions/download-artifact@v8
        with:
          name: formula
          path: Formula

      - name: Set up Homebrew
        id: setup-homebrew
        # Pinned to 2026.08.10.2 (what '@master' itself currently resolves to): the 'master' branch
        # sync is being phased out ahead of Homebrew 5.2.0. Needs a tag that already ships the
        # 'tap-name' output (added 2026-07-31, after the 2026.07.10.1 tag GitHub's own warning names).
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49

      - name: Audit formula
        # Homebrew now rejects a bare formula path for audit/install/test (Homebrew/brew#18873);
        # it must resolve the formula by name through a tap. setup-homebrew already taps this
        # checkout (with the freshly rendered Formula/ideasy.rb) under the tap name it reports here.
        run: brew audit --strict --online --formula "${{ steps.setup-homebrew.outputs.tap-name }}/ideasy"

      - name: Install formula
        run: brew install --formula "${{ steps.setup-homebrew.outputs.tap-name }}/ideasy"

      - name: Test formula
        run: brew test "${{ steps.setup-homebrew.outputs.tap-name }}/ideasy"

  publish:
    name: Publish formula
    needs: [ render, verify ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: devonfw/homebrew-IDEasy
          ref: ${{ inputs.ref }}
          # When called from another repository the automatic token cannot write to this tap.
          token: ${{ secrets.ACTION_PUSH_TOKEN || github.token }}

      - name: Download rendered formula
        uses: actions/download-artifact@v8
        with:
          name: formula
          path: Formula

      - name: Commit and push formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git diff --quiet -- Formula/ideasy.rb
          then
            echo "Formula already up to date for ${VERSION}, nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ideasy.rb
          git commit -m "ideasy ${VERSION}"
          git push
