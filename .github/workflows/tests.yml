# =============================================================================
# tests.yml - CI workflow that audits the IDEasy formula
# =============================================================================
# Runs on every push and pull request to validate the tap itself.
#
# No bottles are built: the formula ships prebuilt binaries downloaded from
# Maven Central, so there is nothing to compile and nothing to bottle.
# A newly rendered formula is verified end to end (audit + install + test)
# by the release workflow of devonfw/IDEasy and by publish-formula.yml.
# This workflow guards manual edits to the tap.
# =============================================================================

name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    name: Tap syntax and audit
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

  template-drift:
    name: Formula matches template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Re-render the formula from the template and compare
        run: |
          cp Formula/ideasy.rb "${RUNNER_TEMP}/ideasy.rb.published"
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/ideasy.rb)"
          shas=()
          while IFS= read -r sha; do
            shas+=("$sha")
          done < <(sed -n 's/^      sha256 "\(.*\)"$/\1/p' Formula/ideasy.rb)
          if [ "${#shas[@]}" -ne 4 ]; then
            echo "ERROR: expected 4 sha256 entries in the published formula, found ${#shas[@]}." >&2
            exit 1
          fi
          ./render-formula.sh "$version" "${shas[0]}" "${shas[1]}" "${shas[2]}" "${shas[3]}"
          if ! diff -u "${RUNNER_TEMP}/ideasy.rb.published" Formula/ideasy.rb; then
            echo "" >&2
            echo "ERROR: Formula/ideasy.rb does not match Formula/ideasy.rb.template." >&2
            echo "       Edit the template - the formula is generated by render-formula.sh." >&2
            exit 1
          fi
          echo "Formula/ideasy.rb is in sync with Formula/ideasy.rb.template"
